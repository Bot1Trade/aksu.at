<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090f">
<meta name="robots" content="noindex">
<title>404 · aksu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23c084fc'/><text x='32' y='45' font-family='Arial' font-weight='bold' font-size='36' fill='%230a0d14' text-anchor='middle'>?</text></svg>">
<link rel="preload" href="/font-space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/font-inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css?v=6">
<script src="/common.js?v=3"></script>
<style>
  body{justify-content:center}
  .box{max-width:640px;margin:0 auto;padding:48px 20px;text-align:center}
  .big{font-family:"Space Grotesk";font-weight:700;font-size:clamp(120px,32vw,240px);line-height:.85;letter-spacing:-.06em;position:relative;display:inline-block;
    background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
  .big::before,.big::after{content:"404";position:absolute;inset:0;background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent}
  .big::before{animation:g1 2.6s infinite steps(1);clip-path:inset(0 0 60% 0)}
  .big::after{animation:g2 3.1s infinite steps(1);clip-path:inset(55% 0 0 0)}
  @keyframes shine{to{background-position:200% 0}}
  @keyframes g1{0%,92%,100%{transform:none}93%{transform:translate(-6px,-2px)}96%{transform:translate(5px,1px)}}
  @keyframes g2{0%,88%,100%{transform:none}89%{transform:translate(6px,2px)}94%{transform:translate(-4px,0)}}
  h1{font-size:clamp(24px,4vw,34px);margin-top:18px}
  p.sub{color:var(--muted);margin:10px auto 26px;max-width:42ch;line-height:1.6}
  .path{font-family:"JetBrains Mono";font-size:13px;color:var(--danger);word-break:break-all}
  .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .acts .btn{padding:12px 18px;border-radius:12px}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div><div class="grid-bg" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<div class="box">
  <div class="big">404</div>
  <h1 id="h">Diese Seite hat sich verlaufen.</h1>
  <p class="sub"><span id="s">Die Adresse gibt es nicht (mehr):</span><br><span class="path" id="p"></span></p>
  <div class="acts">
    <a class="btn primary" href="/" id="home">Zur Startseite</a>
  </div>
</div>
<script>
const de=AKSU.lang==='de';AKSU.achieve('lost');
const $=id=>document.getElementById(id);
if(!de){document.documentElement.lang='en';$('h').textContent='This page got lost.';$('s').textContent='This address doesn’t exist (anymore):';
  $('home').textContent='Back to home'}
$('p').textContent=location.pathname+location.search;
</script>
<script src="/app.js" defer></script>
</body>
</html>

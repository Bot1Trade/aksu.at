<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090f">
<meta name="description" content="Minesweeper im Browser – drei Schwierigkeitsstufen, Flaggen per Rechtsklick oder langem Drücken.">
<link rel="canonical" href="https://aksu.at/minesweeper.html">
<title>Minesweeper · aksu.at</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text x='32' y='48' font-size='44' text-anchor='middle'>💣</text></svg>">
<link rel="preload" href="font-space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="font-inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=5">
<script src="common.js?v=2"></script>
<style>
  .board{display:grid;gap:2px;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:0 auto}
  .c{aspect-ratio:1;border:0;border-radius:4px;padding:0;background:linear-gradient(145deg,rgba(124,156,255,.55),rgba(192,132,252,.45));opacity:.9;
     font-weight:600;font-size:clamp(11px,3.4vw,16px);display:grid;place-items:center;color:var(--ink);cursor:pointer}
  .c:hover{opacity:1}
  .c.open{background:rgba(255,255,255,.05);opacity:1;cursor:default}
  .c.flag::after{content:"🚩";font-size:.9em}
  .c.boom{background:var(--danger);opacity:1}
  .n1{color:#90cdf4}.n2{color:#9ae6b4}.n3{color:#feb2b2}.n4{color:#d6bcfa}.n5{color:#fbd38d}.n6{color:#81e6d9}.n7{color:#e2e8f0}.n8{color:#a0aec0}
  .levels{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div><div class="grid-bg" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<div class="wrap">
  <div class="top"><a class="back" href="./">← aksu</a><h1 style="font-size:26px">Minesweeper</h1></div>
  <div class="panel">
    <div class="bar">
      <div class="levels" role="group" aria-label="Schwierigkeit" data-en-label="Difficulty">
        <button data-l="0" aria-pressed="true" data-en="Easy">Leicht</button>
        <button data-l="1" data-en="Medium">Mittel</button>
        <button data-l="2" data-en="Hard">Schwer</button>
      </div>
      <button id="flagMode" aria-pressed="false" title="Flaggen-Modus für Touch" data-en="🚩 Flag">🚩 Flagge</button>
    </div>
    <div class="bar">
      <span class="stat"><span data-en="Mines">Minen</span>: <b id="left">0</b></span>
      <span class="stat"><span data-en="Time">Zeit</span>: <b id="time">0</b>s</span>
      <button class="primary" id="new" data-en="New game">Neues Spiel</button>
    </div>
    <div id="board" class="board"></div>
    <div class="msg" id="msg"></div>
    <p class="hint" data-en="Right-click or long-press places a flag. Clicking a number reveals its neighbours once enough flags are set.">Rechtsklick oder langes Drücken setzt eine Flagge. Klick auf eine Zahl deckt die Nachbarn auf, wenn genug Flaggen gesetzt sind.</p>
  </div>
</div>
<script>
const LEVELS=[{w:9,h:9,m:10},{w:12,h:12,m:24},{w:16,h:16,m:40}];
let L=LEVELS[0],cells,mines,opened,flags,started,over,timer,t0,flagMode=false;
const B=document.getElementById('board'),msg=document.getElementById('msg');
const $left=document.getElementById('left'),$time=document.getElementById('time');

function idx(x,y){return y*L.w+x}
function nb(i){const x=i%L.w,y=Math.floor(i/L.w),r=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;
    if(nx>=0&&ny>=0&&nx<L.w&&ny<L.h)r.push(idx(nx,ny))}return r}

function init(){
  clearInterval(timer);started=false;over=false;opened=0;flags=0;msg.textContent='';$time.textContent='0';
  mines=new Array(L.w*L.h).fill(false);
  B.innerHTML='';B.style.gridTemplateColumns=`repeat(${L.w},1fr)`;B.style.maxWidth=(L.w*36)+'px';
  cells=[];
  for(let i=0;i<L.w*L.h;i++){
    const b=document.createElement('button');b.className='c';b.dataset.i=i;b.setAttribute('aria-label',AKSU.t('Feld','Cell'));
    cells.push(b);B.appendChild(b);
  }
  $left.textContent=L.m;
}
function place(safe){
  const forbidden=new Set([safe,...nb(safe)]);let n=0;
  while(n<L.m){const r=Math.floor(Math.random()*mines.length);if(!mines[r]&&!forbidden.has(r)){mines[r]=true;n++}}
}
function count(i){return nb(i).filter(j=>mines[j]).length}
function open(i){
  const c=cells[i];if(c.classList.contains('open')||c.classList.contains('flag'))return;
  if(mines[i]){lose(i);return}
  const stack=[i];
  while(stack.length){const k=stack.pop(),e=cells[k];
    if(e.classList.contains('open')||e.classList.contains('flag'))continue;
    e.classList.add('open');opened++;const n=count(k);
    if(n){e.textContent=n;e.classList.add('n'+n)}else stack.push(...nb(k));
  }
  if(opened===L.w*L.h-L.m)win();
}
function chord(i){
  const n=count(i),ns=nb(i);
  if(ns.filter(j=>cells[j].classList.contains('flag')).length===n)ns.forEach(j=>{if(!over)open(j)});
}
function toggleFlag(i){
  const c=cells[i];if(c.classList.contains('open')||over)return;
  c.classList.toggle('flag');flags+=c.classList.contains('flag')?1:-1;$left.textContent=L.m-flags;
}
function act(i,flag){
  if(over)return;
  if(flag){toggleFlag(i);return}
  if(!started){started=true;place(i);AKSU.played('minesweeper');t0=Date.now();timer=setInterval(()=>$time.textContent=Math.floor((Date.now()-t0)/1000),250)}
  const c=cells[i];
  if(c.classList.contains('open')){chord(i);return}
  open(i);
}
function lose(i){
  over=true;clearInterval(timer);
  mines.forEach((m,k)=>{if(m){cells[k].classList.add('open');cells[k].textContent='💣'}});
  cells[i].classList.add('boom');msg.textContent=AKSU.t('Boom! Versuch es nochmal.','Boom! Try again.');msg.style.color='var(--danger)';
}
function win(){
  over=true;clearInterval(timer);
  mines.forEach((m,k)=>{if(m&&!cells[k].classList.contains('flag'))cells[k].classList.add('flag')});$left.textContent=0;
  msg.textContent=AKSU.t(`Geschafft in ${$time.textContent} Sekunden!`,`Cleared in ${$time.textContent} seconds!`);AKSU.achieve('mines');AKSU.report('minesweeper',{time:+$time.textContent});if(L===LEVELS[2])AKSU.achieve('minesHard');msg.style.color='var(--ok)';
}

// Eingabe: Klick, Rechtsklick, langes Drücken
let pressT=null,longFired=false;
B.addEventListener('contextmenu',e=>{e.preventDefault();const c=e.target.closest('.c');if(c&&!longFired)act(+c.dataset.i,true)});
B.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.c');if(!c||e.button===2)return;longFired=false;
  if(e.pointerType!=='mouse')pressT=setTimeout(()=>{longFired=true;act(+c.dataset.i,true);navigator.vibrate&&navigator.vibrate(20)},400);
});
['pointerup','pointerleave','pointercancel'].forEach(t=>B.addEventListener(t,()=>clearTimeout(pressT)));
B.addEventListener('click',e=>{
  const c=e.target.closest('.c');if(!c)return;
  if(longFired){longFired=false;return}
  act(+c.dataset.i,flagMode&&!c.classList.contains('open'));
});

document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-l]').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');L=LEVELS[+b.dataset.l];init();
});
document.getElementById('flagMode').onclick=e=>{flagMode=!flagMode;e.currentTarget.setAttribute('aria-pressed',flagMode)};
document.getElementById('new').onclick=init;
init();
</script>
<script src="app.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090f">
<title>Snake · aksu.at</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text x='32' y='48' font-size='44' text-anchor='middle'>🐍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<style>
  canvas{display:block;width:100%;max-width:420px;aspect-ratio:1;margin:0 auto;border-radius:12px;background:var(--soft);touch-action:none}
  .pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:16px}
  .pad button{justify-content:center;font-size:18px}
  .pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div><div class="grid-bg" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<div class="wrap">
  <div class="top"><a class="back" href="./">← aksu</a><h1 style="font-size:26px">Snake</h1></div>
  <div class="panel">
    <div class="bar">
      <span class="stat">Punkte: <b id="score">0</b></span>
      <span class="stat">Rekord: <b id="best">0</b></span>
      <button class="primary" id="start">Start</button>
    </div>
    <canvas id="c" width="400" height="400" aria-label="Spielfeld"></canvas>
    <div class="pad" aria-label="Steuerung">
      <button class="u" data-d="0,-1" aria-label="Hoch">▲</button>
      <button class="l" data-d="-1,0" aria-label="Links">◀</button>
      <button class="d" data-d="0,1" aria-label="Runter">▼</button>
      <button class="r" data-d="1,0" aria-label="Rechts">▶</button>
    </div>
    <div class="msg" id="msg"></div>
    <p class="hint">Pfeiltasten / WASD, Wischen oder die Knöpfe. Leertaste pausiert.</p>
  </div>
</div>
<script>
const N=20,cv=document.getElementById('c'),ctx=cv.getContext('2d'),S=cv.width/N;
const $s=document.getElementById('score'),$b=document.getElementById('best'),msg=document.getElementById('msg'),btn=document.getElementById('start');
let snake,dir,queue,food,score,loop,running=false,paused=false,best=0;
try{best=+localStorage.getItem('snake-best')||0}catch(e){}
$b.textContent=best;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function reset(){
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};queue=[];score=0;$s.textContent=0;msg.textContent='';spawn();draw();
}
function spawn(){
  do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y));
}
function speed(){return Math.max(60,140-score*3)}
function tick(){
  if(queue.length){const d=queue.shift();if(d.x!==-dir.x||d.y!==-dir.y)dir=d}
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y))return end();
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;$s.textContent=score;spawn()}else snake.pop();
  draw();loop=setTimeout(tick,speed());
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const acc=css('--accent'),dng=css('--danger');
  ctx.fillStyle=dng;ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S*.38,0,Math.PI*2);ctx.fill();
  snake.forEach((p,i)=>{ctx.globalAlpha=i?Math.max(.45,1-i*.03):1;ctx.fillStyle=acc;
    const r=4;ctx.beginPath();ctx.roundRect(p.x*S+1,p.y*S+1,S-2,S-2,r);ctx.fill()});
  ctx.globalAlpha=1;
}
function start(){clearTimeout(loop);reset();running=true;paused=false;btn.textContent='Neu starten';loop=setTimeout(tick,speed())}
function end(){
  running=false;clearTimeout(loop);
  if(score>best){best=score;$b.textContent=best;try{localStorage.setItem('snake-best',best)}catch(e){}msg.textContent=`Neuer Rekord: ${score}!`;msg.style.color='var(--ok)'}
  else{msg.textContent=`Game over – ${score} Punkte`;msg.style.color='var(--danger)'}
  btn.textContent='Nochmal';
}
function turn(x,y){if(!running){start()}queue.push({x,y});if(queue.length>3)queue.shift()}

const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{
  if(e.key===' '&&running){e.preventDefault();paused=!paused;if(paused){clearTimeout(loop);msg.textContent='Pause';msg.style.color=''}else{msg.textContent='';tick()}return}
  const k=K[e.key]||K[e.key.toLowerCase?.()];if(k){e.preventDefault();turn(...k)}
});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(...b.dataset.d.split(',').map(Number)));
let sx,sy;
cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20){if(!running)start();return}
  Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
btn.onclick=start;
reset();
</script>
</body>
</html>
